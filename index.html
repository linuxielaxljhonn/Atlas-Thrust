<style>
:root{--bg:#F1F4F3;--card:#fff;--ink:#17212B;--muted:#56636E;--line:#D3DBD8;--acc:#2445C4;--bad:#B8322A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E141A;--card:#172029;--ink:#E5EBEE;--muted:#93A1AB;--line:#283540;--bad:#F06C5E;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(380px,100%);display:grid;gap:14px}
h1{margin:0;font-size:1.5rem;line-height:1.15}
p{margin:0;color:var(--muted);font-size:.95rem}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=password]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em}
</style>
</head>

</form>

const K="lock-atlasthrust";
const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:d64(P.s),iterations:P.n},base,256)}
async function open(raw){const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(P.i)},key,d64(P.c));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
const get=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
const set=v=>{try{v?localStorage.setItem(K,v):localStorage.removeItem(K)}catch(e){}};
(async()=>{
  if(location.hash==="#salir"){set(null);history.replaceState(null,"",location.pathname)}
  const saved=get();
  if(saved){try{await open(d64(saved));return}catch(e){set(null)}}
  const f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus();
  f.addEventListener("submit",async ev=>{ev.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");b.disabled=true;b.textContent="Comprobando…";er.textContent="";
    const remember=document.getElementById("rem").checked;
    try{const raw=await derive(document.getElementById("pw").value);await open(raw);if(remember) set(e64(raw))}
    catch(e){er.textContent="Contraseña incorrecta. Revisa mayúsculas y guiones.";b.disabled=false;b.textContent="Entrar"}
  });
})();
})();
